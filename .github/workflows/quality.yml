name: RepoMind quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose -f eval/compose.yml up -d --wait
      - run: mvn -B -Dspring.profiles.active=eval '-Dtest=*Test,*Tests,RetrievalReplayIT,SyncSnapshotIT,RedisImpactIT,RedisAppendIT,RedisAvailabilityIT,RedisMemoryWindowIT,ActivityRecoveryIT,EmbeddingProviderIT' test
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            target/retrieval-replay.json
            target/redis-impact.json
            target/redis-append.json
            target/surefire-reports/TEST-*.xml
      - if: always()
        run: docker compose -f eval/compose.yml down

